        const sig = x => x.matches.map(m => [m.a.slice().sort().join("+"), m.b.slice().sort().join("+")].sort().join(" v ")).sort().join("|") + "#" + x.sit.slice().sort().join(",");
        S.rounds = all.slice(0, idx);
        let nr = buildRound();
        for(let i=0; nr && i<6 && sig(nr)===sig(rr); i++) nr = buildRound(i>=1);
        S.rounds = all; S.plan = plan;
        if(nr){ rr.matches = nr.matches; rr.sit = nr.sit; rr.away = nr.away; }
      }
      rr.matches.forEach(m => { m.h = []; m.closed = false; delete m.manual; });
      if(reopen){ rr.finished = false; viewIdx = null; }
      pad = null; swap = null;
      toast(rlabel(rr) + (redraw ? " reset with new players" : " scores cleared"));
    }
    else if(a==="rreopen" && tr){
      if(r && r!==tr){ if(!confirm("Remove round " + r.n + " and reopen round " + tr.n + "?")) return; S.rounds.pop(); }
      tr.finished = false; viewIdx = null; toast("Round " + tr.n + " reopened");
    }
    else if(a==="swap" && tr){ swap = {ri: S.rounds.indexOf(tr), m: +el.dataset.m}; }
    else if(a==="swapclose"){ swap = null; }
    else if(a==="undo" && tr){ const m = tr.matches[+el.dataset.m]; if(m.manual) delete m.manual; else if(m.closed) m.closed=false; else m.h.pop(); }
    else if(a==="pad" && tr){
      const m = tr.matches[+el.dataset.m];
      pad = {ri: S.rounds.indexOf(tr), m:+el.dataset.m, vals: m.manual ? m.manual.map(String) : ["",""], auto: m.manual ? [false,false] : [true,true], focus:0};
    }
    else if(a==="padclose"){ pad = null; }
    else if(a==="padfocus" && pad){ pad.focus = +el.dataset.f; }
    else if(a==="key" && pad){ padKey(el.dataset.k); }
    else if(a==="padgo" && pad){ if(!padGo()) { render(); return; } }
    else if(a==="close" && tr){ tr.matches[+el.dataset.m].closed = true; }
    else if(a==="reopen" && tr){ tr.matches[+el.dataset.m].closed = false; }
    else if(a==="start"){
      const plan = getPlan();
      let nr = plan && plan.rounds[0] ? plan.rounds[0] : buildRound();
      if(nr){
        const st = S.settings;
        nr.mode = st.mode; nr.rules = rulesFrom(st); nr.matches.forEach(m => { m.h = []; m.closed = false; delete m.manual; });
        S.rounds.push(nr); viewIdx = null;
        if(plan){ plan.rounds.shift(); plan.key = planKey(); if(!plan.rounds.length) S.plan = null; }
      }
    }
    else if(a==="shuffle" && r){
      if(r.matches.some(m => m.h.length || m.manual) && !confirm("Clear all scores in round " + r.n + " and draw new players and teams?")) return;
      S.rounds.pop();
      const sig = x => x.matches.map(m => [m.a.slice().sort().join("+"), m.b.slice().sort().join("+")].sort().join(" v ")).sort().join("|") + "#" + x.sit.slice().sort().join(",");
      let nr = buildRound();
      for(let i=0; nr && i<6 && sig(nr)===sig(r); i++) nr = buildRound(i>=1);
      S.rounds.push(nr || r); pad = null; swap = null;
      if(nr) toast("Round " + nr.n + " shuffled");
    }
    else if(a==="cancel" && r){ S.rounds.pop(); }
    else if(a==="finish" && r){
      const open = r.matches.filter(m => !matchState(m, r).done).length;
      if(open && !confirm(open + " match" + (open===1?" isn’t":"es aren’t") + " finished. End the round with the current scores?")) return;
      r.finished = true; viewIdx = null; toast("Round " + r.n + " saved");
    }
    else if(a==="toggle"){
      const p = byId(el.dataset.id); if(!p) return;
      p.out = !p.out;
      if(p.out && r){
        const mi = r.matches.findIndex(m => m.a.includes(p.id) || m.b.includes(p.id));
        if(mi>=0 && confirm(p.name + " is on " + r.matches[mi].court + ". Pick a replacement now?")){
          tab = "play"; viewIdx = null; swap = {ri: S.rounds.length-1, m: mi};
        }
      }
    }
    else if(a==="remove"){
      const p = byId(el.dataset.id); if(!p) return;
      if(r && r.matches.some(m => m.a.includes(p.id) || m.b.includes(p.id))){ toast(p.name + " is on court. Mark them as sitting out instead."); return; }
      if(!confirm("Remove " + p.name + "?")) return;
      if(S.rounds.some(x => x.matches.some(m => m.a.includes(p.id)||m.b.includes(p.id)))) p.removed = true;
      else S.players = S.players.filter(x => x.id !== p.id);
    }
    else if(a==="tauto"){
      if(S.teams.length && !confirm("Replace your current teams with random pairs?")) return;
      const ids = shuffle(visiblePlayers().map(p=>p.id)); S.teams = [];
      for(let i=0;i+1<ids.length;i+=2) S.teams.push([ids[i], ids[i+1]]);
      toast(S.teams.length + " teams made" + (ids.length%2 ? ", 1 player left over" : ""));
    }
    else if(a==="tadd"){
      const teamed = new Set(S.teams.flat().filter(Boolean));
      const loose = visiblePlayers().filter(p => !teamed.has(p.id)).map(p=>p.id);
      S.teams.push([loose[0]||"", loose[1]||""]);
    }
    else if(a==="tremove"){ S.teams.splice(+el.dataset.i, 1); }
    else if(a==="cadd"){
      let n = S.courts.length + 1;
      while(S.courts.some(c => c.name === "Court " + n)) n++;
      S.courts.push({id:"c" + (S.cseq++), name:"Court " + n, on:true});
      toast("Court " + n + " added");
    }
    else if(a==="ctoggle"){ const c = S.courts.find(x => x.id===el.dataset.id); if(c) c.on = !c.on; }
    else if(a==="cremove"){
      if(S.courts.length<=1){ toast("Keep at least one court"); return; }
      S.courts = S.courts.filter(x => x.id !== el.dataset.id);
    }
    else if(a==="set"){
      const path = el.dataset.path, raw = el.dataset.v;
      const val = raw==="true" ? true : raw==="false" ? false : /^\d+$/.test(raw) ? +raw : raw;
      if(!path.includes(".")) S.settings[path] = val; else setP(path, val);
    }
    else if(a==="step"){ clampSet(el.dataset.path, getP(el.dataset.path) + (+el.dataset.d)); }
    else if(a==="rrename"){ editRound = +el.dataset.i; render(); const i = document.querySelector("[data-rname]"); if(i){ i.focus(); i.select(); } return; }
    else if(a==="rnamesave"){ const i = document.querySelector("[data-rname]"); if(i) applyRoundName(i); editRound = null; }
    else if(a==="meetnew"){ tab = "events"; meetPick = null; render(); const e = document.getElementById("newmeet"); if(e) e.scrollIntoView({block:"start"}); const i = document.getElementById("evname"); if(i) i.focus({preventScroll:true}); return; }
    else if(a==="mpick"){ const p = getPick(), k = el.dataset.k; if(p.has(k)) p.delete(k); else p.add(k); }
    else if(a==="mpickall"){ meetPick = new Set(roster().map(x => x.k)); }
    else if(a==="mpicknone"){ meetPick = new Set(); }
    else if(a==="evnew"){
      const name = document.getElementById("evname").value.trim(), date = document.getElementById("evdate").value || todayISO();
      const n = fresh(name, date), pick = getPick();
      let seq = S.seq || 1;
      n.players = roster().filter(x => pick.has(x.k)).map(x => {
        const cur = S.players.find(p => !p.removed && p.name.trim().toLowerCase()===x.k);
        return cur ? {id:cur.id, name:cur.name, out:false} : {id:"p" + (seq++), name:x.name, out:false};
      });
      n.seq = seq; n.courts = JSON.parse(JSON.stringify(S.courts)); n.cseq = S.cseq;
      n.settings = JSON.parse(JSON.stringify(S.settings));
      const ids = new Set(n.players.map(p=>p.id));
      n.teams = S.teams.filter(t => ids.has(t[0]) && ids.has(t[1])).map(t => t.slice());
      save(); switchTo(n); DB.sessions.push(n); meetPick = null;
      toast(n.meta.name + " created");
      if(n.players.length < 4) tab = "players";
    }
    else if(a==="evopen"){ const x = DB.sessions.find(z => z.meta.id===el.dataset.id); if(x){ save(); switchTo(x); toast(x.meta.name + " opened"); } }
    else if(a==="evdel"){
      const x = DB.sessions.find(z => z.meta.id===el.dataset.id); if(!x) return;
      if(!confirm("Delete " + x.meta.name + " and all its rounds?")) return;
      DB.sessions.splice(DB.sessions.indexOf(x), 1);
      cloudForget(x.meta.id);
      if(x===S){
        const next = DB.sessions.slice().sort((p,q) => (q.meta.date||"").localeCompare(p.meta.date||""))[0];
        if(next) switchTo(next); else { const f = fresh(); DB.sessions.push(f); switchTo(f); tab = "players"; }
        tab = "events";
      }
      toast("Meet deleted");
    }
    else if(a==="newsession"){
      viewIdx = null;
      if(!confirm("Clear all rounds and standings? Players and courts stay.")) return;
      S.rounds = []; S.plan = null; S.players = S.players.filter(p => !p.removed); toast("Rounds cleared");
    }
    else if(a==="wipe"){
      if(!confirm("Delete all players, courts, rounds and settings?")) return;
      S = fresh(); tab = "players"; viewIdx = null;
    }
    save(); render();
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if(el && el.tagName !== "FORM") act(el);
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if(t.dataset.rname!==undefined){ applyRoundName(t); editRound = null; save(); render(); return; }
    if(t.dataset.ev){
      if(t.dataset.ev==="name"){ const v2 = t.value.trim(); if(v2) S.meta.name = v2; }
      else if(t.value) S.meta.date = t.value;
      save(); render(); return;
    }
    if(t.dataset.swap && swap){
      const r = S.rounds[swap.ri];
      doSwap(r, swap.m, t.dataset.swap[0], +t.dataset.swap[1], t.value);
      save(); render(); toast("Players updated"); return;
    }
    if(t.dataset.team!==undefined){
      const i = +t.dataset.team, slot = +t.dataset.slot, id = t.value, old = S.teams[i][slot];
      if(id){ S.teams.forEach((tm,j) => tm.forEach((x,k) => { if(x===id && !(j===i && k===slot)) S.teams[j][k] = old || ""; })); }
      S.teams[i][slot] = id; save(); render();
    }
    else if(t.dataset.path){ clampSet(t.dataset.path, t.value); save(); render(); }
    else if(t.dataset.court){
      const c = S.courts.find(x => x.id===t.dataset.court);
      const name = t.value.trim();
      if(c){ if(name) c.name = name; save(); render(); }
    }
  });
  document.addEventListener("keydown", e => {
    if(pad){
      if(/^[0-9]$/.test(e.key)){ padKey(e.key); renderPad(); e.preventDefault(); return; }
      if(e.key==="Backspace"){ padKey("back"); renderPad(); e.preventDefault(); return; }
      if(e.key==="Tab" || e.key==="ArrowLeft" || e.key==="ArrowRight"){ pad.focus = 1-pad.focus; renderPad(); e.preventDefault(); return; }
      if(e.key==="Enter"){ if(padGo()){ save(); render(); } else renderPad(); e.preventDefault(); return; }
      if(e.key==="Escape"){ pad = null; renderPad(); return; }
    }
    if(swap && e.key==="Escape"){ swap = null; renderPad(); return; }
    if(e.key==="Enter" && e.target.matches("input[data-path], input[data-court], input[data-rname], input[data-ev]")) e.target.blur();
  });
  document.addEventListener("submit", e => {
    if(!e.target.matches('[data-act="addform"]')) return;
    e.preventDefault();
    const inp = document.getElementById("newname");
    const name = inp.value.trim();
    if(!name){ inp.focus(); return; }
    if(visiblePlayers().some(p => p.name.toLowerCase() === name.toLowerCase())){ toast(name + " is already on the list"); return; }
    S.players.push({id: "p" + (S.seq++), name, out:false});
    save(); render();
    const n = document.getElementById("newname"); if(n) n.focus();
  });

  if(!S.players.length) tab = "players";
  render();
  cloudInit();
})();
</script>
</body>
</html>
